
name: Build NEXO Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - android-sqlite-migration

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Descargar código
        uses: actions/checkout@v4

      - name: Preparar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Preparar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      - name: Instalar dependencias web y Capacitor
        run: npm install

      - name: Compilar aplicación web
        run: npm run build

      - name: Crear proyecto Android
        run: npx cap add android

      - name: Sincronizar SQLite y archivos web
        run: npx cap sync android

      - name: Construir APK de prueba
        working-directory: android
        run: ./gradlew assembleDebug

      - name: Publicar APK para descargar
        uses: actions/upload-artifact@v4
        with:
          name: NEXO-Android-debug-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
